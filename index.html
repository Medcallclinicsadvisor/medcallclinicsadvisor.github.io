<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>MEDCALL — عيادة NEPT</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="description" content="نظام إدارة عيادة NEPT — MEDCALL">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MEDCALL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
html,body{margin:0;height:100%;background:#fff;overflow:hidden}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#fff;transition:opacity .4s;z-index:2;font-family:Tahoma,Arial,sans-serif;color:#667085}
#splash img{width:min(260px,62vw);height:auto}
.sp{width:34px;height:34px;border:3px solid #ccfbf1;border-top-color:#0f766e;border-radius:50%;animation:r .9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#off{display:none;font-size:15px;text-align:center;padding:0 24px;line-height:1.8}
#off button{margin-top:10px;background:#0f766e;color:#fff;border:0;border-radius:8px;padding:9px 18px;font:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="splash"><img src="logo.png" alt="MEDCALL"><div class="sp" id="sp"></div><div id="off">مفيش إنترنت دلوقتي.<br>اتأكد من الاتصال وجرّب تاني.<br><button onclick="location.reload()">جرّب تاني</button></div></div>
<iframe id="app" title="MEDCALL — عيادة NEPT" allow="clipboard-read; clipboard-write; camera; microphone; fullscreen; geolocation" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
(function(){
  var URL_APP='https://script.google.com/macros/s/AKfycbyhaBIdGhq4e_yinnjFmaNZYL878LjSRn39XKJYaNRNmEZETpc7KHmTjLLqYsavZVjXfA/exec';
  var f=document.getElementById('app'), s=document.getElementById('splash');
  function hide(){ s.style.opacity='0'; setTimeout(function(){ s.style.display='none'; },450); }
  function offline(){ document.getElementById('sp').style.display='none'; document.getElementById('off').style.display='block'; s.style.display='flex'; s.style.opacity='1'; }
  if(!navigator.onLine){ offline(); }
  else { f.addEventListener('load',function(){ setTimeout(hide,600); }); f.src=URL_APP; setTimeout(hide,15000); }
  window.addEventListener('online',function(){ if(!f.src) location.reload(); });
  if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
})();
</script>
</body>
</html>
